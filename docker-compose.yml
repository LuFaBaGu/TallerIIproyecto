services:
  db:
    image: alpine:3.21
    command:
      - sh
      - -c
      - mkdir -p /var/lib/licoreria && chown 10001:10001 /var/lib/licoreria && touch /var/lib/licoreria/.ready && exec tail -f /dev/null
    volumes:
      - sqlite-data:/var/lib/licoreria
    healthcheck:
      test: ["CMD", "test", "-f", "/var/lib/licoreria/.ready"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: "3000"
      DB_FILE: /var/lib/licoreria/licoreria.db
      PYTHON_EXECUTABLE: python3.10
      ADMIN_USER: ${ADMIN_USER:?Define ADMIN_USER en el archivo .env}
      ADMIN_PASS: ${ADMIN_PASS:?Define ADMIN_PASS en el archivo .env}
    volumes:
      - sqlite-data:/var/lib/licoreria
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/categories', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  sqlite-data:
